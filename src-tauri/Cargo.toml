[package]
name = "battery-life-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2" # optional global hotkey (⌥⌘B) to open the popover
starship-battery = "0.11"          # native IOKit battery read (~0.4ms, no subprocess) for the live tray
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"                        # round the popover's native NSWindow (transparent + clipped corners)

[profile.release]
opt-level = "s"
lto = true
strip = true
