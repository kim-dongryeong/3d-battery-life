[package]
name = "joule-desktop"
version = "1.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2" # optional global hotkey (⌥⌘B) to open the popover
tauri-plugin-updater = "2"         # Sparkle-style auto update — GitHub 릴리스의 latest.json 피드
starship-battery = "0.11"          # native IOKit battery read (~0.4ms, no subprocess) for the live tray
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSWorkspace", "NSRunningApplication", "NSFont", "NSAttributedString", "NSButton", "NSControl", "NSFontDescriptor", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSGraphics", "NSCell"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry", "NSArray", "NSAttributedString", "NSString", "NSDictionary", "NSValue", "NSObject"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"                        # round the popover's native NSWindow (transparent + clipped corners)

[profile.release]
opt-level = "s"
lto = true
strip = true
