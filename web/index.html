<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D 분석 리포트</title>
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "/vendor/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <div id="scene"></div>

  <!-- top-left: live status -->
  <header id="hud">
    <h1>🔋 3D 분석 리포트 <a class="help-link" id="helpBtn" href="/help.html" title="지표·방법 과학 안내">?안내</a></h1>
    <div id="healthBig" class="healthBig" title="현재 최대 용량 (= macOS 배터리 성능의 Maximum Capacity) · 사이클"></div>
    <div id="trend" class="trend">불러오는 중…</div>
    <dl id="stats"></dl>
  </header>

  <!-- top-right: controls -->
  <section id="panel">
    <div class="grp">
      <span class="lbl">데이터</span>
      <div class="seg" data-group="source">
        <button data-val="demo2">데모2 ✨</button>
        <button data-val="demo">데모1</button>
        <button data-val="real" class="on">내 데이터</button>
      </div>
    </div>
    <div class="grp">
      <span class="lbl">세로축 (Y · 높이)</span>
      <div class="seg" data-group="y">
        <button data-val="pct" class="on">배터리 %</button>
        <button data-val="watts">전력 W</button>
        <button data-val="rate" title="배터리 잔량 변화율 d(잔량)/dt · +충전 −방전 · mAh 원시용량 기반(부드러움)">잔량 변화 %/min</button>
      </div>
    </div>
    <div class="grp" id="rateWinGrp" hidden>
      <span class="lbl">평활 창 (좁을수록 예민)</span>
      <div class="seg" data-group="rateWin">
        <button data-val="120">2분</button>
        <button data-val="300" class="on">5분</button>
        <button data-val="600">10분</button>
        <button data-val="1200">20분</button>
      </div>
    </div>
    <div class="grp">
      <span class="lbl">시각 축 (X · 가로 폭)</span>
      <div class="seg" data-group="xScale">
        <button data-val="1" class="on">1×</button>
        <button data-val="1.5">1.5×</button>
        <button data-val="2">2×</button>
        <button data-val="3">3×</button>
      </div>
    </div>
    <div class="grp">
      <span class="lbl">색상</span>
      <div class="seg" data-group="color">
        <button data-val="state" class="on">충/방전</button>
        <button data-val="lowPower" title="저전력 모드 구간을 노란색으로 (기록 이후 데이터만)">저전력</button>
        <button data-val="tempC">온도</button>
        <button data-val="loadPct">CPU부하</button>
        <button data-val="watts">전력</button>
      </div>
    </div>
    <div class="grp row">
      <label><input type="checkbox" id="spin" /> 자동회전</label>
      <button id="theme" class="btn">🌙 다크</button>
      <button id="reset" class="btn">시점 리셋</button>
      <button id="gear" class="btn" title="뷰어 설정" aria-label="뷰어 설정">⚙</button>
    </div>
    <div id="viewerSettings" hidden>
      <div class="grp">
        <span class="lbl">포인터 마커 크기</span>
        <div class="seg" data-group="markerSize">
          <button data-val="0.12">작게</button>
          <button data-val="0.2" class="on">보통</button>
          <button data-val="0.32">크게</button>
        </div>
      </div>
      <div class="grp">
        <span class="lbl">계산 정밀도</span>
        <div class="seg" data-group="rateLevel">
          <button data-val="rawcap" class="on" title="원시 배터리 용량(mAh) 기반 · ~0.02% 해상도 · 부드럽고 정확 (권장) — 모든 계산의 기본값입니다.">정밀 mAh</button>
          <button data-val="pct" title="macOS가 1% 단위 정수로 주는 표시 %입니다. 정밀하지 않고 권장하지 않습니다 — 이 값으로 한 분석은 유의미한 insight를 주지 못합니다. 켜면 배터리 %·잔량 변화·구간별 방전 속도 등 모든 계산이 정밀 mAh 없이 거친 정수%가 됩니다.">정수%</button>
        </div>
      </div>
    </div>
    <div id="legend">
      <div class="bar"></div>
      <div class="ends"><span id="legMin"></span><span id="legLbl"></span><span id="legMax"></span></div>
    </div>
    <p class="hint">드래그=회전 · 휠=줌 · 우클릭드래그=이동 · 곡선에 마우스를 올리면 그 세션 정보가 보입니다.</p>
  </section>

  <!-- bottom-left: per-band average discharge speed -->
  <section id="buckets"></section>

  <!-- bottom: selected-band rate trend over time (aging) -->
  <section id="trendchart" hidden></section>

  <!-- hover detail -->
  <nav id="lnav"></nav>            <!-- layout nav (tabs / dock / sidebar list) — filled per layout -->
  <div id="insight" hidden></div>  <!-- E 카드 레이아웃: 결론 카드 -->
  <aside id="tip" hidden></aside>
  <div id="empty" hidden>아직 배터리 세션 데이터가 충분하지 않습니다.<br/>백그라운드 기록이 쌓이면 여기에 나타납니다. 지금은 <b>데모(1년)</b>를 보세요.</div>

  <!-- 지표·방법 안내 — WKWebView(앱 창)는 target=_blank를 무시하므로 앱 내부 모달로 표시 -->
  <div id="helpModal" class="modal" hidden>
    <div class="modalCard">
      <button id="helpClose" class="modalX" type="button" aria-label="닫기">✕</button>
      <iframe id="helpFrame" title="지표·방법 안내"></iframe>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
